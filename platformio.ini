; PlatformIO Project Configuration
; ESP32-S3 Dashcam — Dual Platform
; Platform A: Seeed XIAO ESP32S3 Sense (OV2640, headless)
; Platform B: Waveshare ESP32-S3-Touch-LCD-3.5B-C (OV5640, 3.5" touch)

; =============================================================================
; Shared configuration
; =============================================================================
[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17

build_unflags = -std=gnu++11

lib_deps =
    https://github.com/jchmiel123/esp32-i2c-bus.git
    lewisxhe/XPowersLib@^0.2.6
    lewisxhe/SensorLib@^0.2.6

; =============================================================================
; Platform A — Seeed XIAO ESP32S3 Sense
; OV2640 camera, onboard PDM mic, microSD, no display
; =============================================================================
[env:xiao-s3]
board = seeed_xiao_esp32s3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_build.psram_type = opi
board_build.partitions = default_8MB.csv

build_flags =
    ${env.build_flags}
    -DPLATFORM_HINT_XIAO=1

; =============================================================================
; Platform B — Waveshare ESP32-S3-Touch-LCD-3.5B-C
; OV5640 camera, 3.5" IPS touch, AXP2101, QMI8658, PCF85063, ES8311
; =============================================================================
[env:waveshare-lcd35]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    ${env.build_flags}
    -DPLATFORM_HINT_WAVESHARE=1

lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@1.4.9
